# Standalone development: The Couch on its own.
#   docker compose up -d --build      ->  http://localhost:8774
# With no model it answers with the offline mind. To use a model, point LLM_URL at one, e.g. the
# platform dev stack's (run this on its network) or the guide repo's standalone llm service.
# On the box, The Couch runs from the airplanemode platform repo at /couch/, using the shared model.

name: couch-dev

services:
  couch:
    build: .
    environment:
      LLM_URL: ${LLM_URL-}
    ports:
      - "${PORT:-8774}:8000"
    mem_limit: 64m
